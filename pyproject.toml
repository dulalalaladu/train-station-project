# uv workspace root + shared Python tool config (ruff, black, pytest defaults).
# Python is 3.10 on the dog (Jetson / ROS 2 Humble, plan §4.5), so stay 3.10-compatible.
# Members are added here explicitly; ROS 2 colcon packages under edge/ros2_ws build with
# colcon/ament, not uv, and are intentionally NOT members.

[project]
name = "railvoice-workspace"
version = "0.0.0"
description = "uv workspace root for RailVoice Python packages"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black>=25.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "edge/ota-agent",
    "edge/sim/dog-sim",
    "tools/asr-eval",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ota_agent", "dog_sim", "asr_eval"]

[tool.black]
line-length = 100
target-version = ["py310"]
