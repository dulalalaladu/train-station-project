name: CI

# Base pipeline (plan §5.5): lint -> typecheck -> test on every PR and on main.
# Image build, Trivy gate, SBOM and DEV deploy are added by T-002 / T-215 (see the
# placeholder job at the bottom). Actions are pinned to commit SHAs; bump deliberately.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary dev host; Linux mirrors the cloud / CI targets.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack reads "packageManager" from package.json and pins pnpm.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # uv honours .python-version (3.10, the Jetson / ROS 2 Humble constraint).
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The root postinstall runs `uv sync --all-packages --locked`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint (eslint + ruff + black)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (vitest + pytest, 80% coverage gate)
        run: pnpm test

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No uv needed here, so skip lifecycle scripts (postinstall / husky).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # Placeholder, intentionally disabled. T-002 (images) and T-215 (supply chain) will:
  #   1. docker buildx build --platform linux/amd64,linux/arm64 for every image
  #   2. Trivy scan, fail on HIGH/CRITICAL (the same image set serves DEV/PILOT/PROD)
  #   3. generate an SBOM
  #   4. on main: push to the registry and let GitOps (Argo CD) pull to DEV
  images:
    name: images + trivy (placeholder, T-002 / T-215)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "reserved for T-002 / T-215"

  # Single status to mark as required in branch protection.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [verify, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "verify=${{ needs.verify.result }} commitlint=${{ needs.commitlint.result }}"
          [ "${{ needs.verify.result }}" = "success" ] || exit 1
          case "${{ needs.commitlint.result }}" in success|skipped) ;; *) exit 1 ;; esac
