[project]
name = "ota-agent"
version = "0.0.0"
description = "狗端 OTA 代理：拉取已签名清单、校验、灰度升级与回滚。"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ota_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ota_agent --cov-report=term-missing --cov-fail-under=80"