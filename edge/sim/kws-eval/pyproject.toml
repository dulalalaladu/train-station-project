[project]
name = "kws-eval"
version = "0.1.0"
description = "T-006 offline keyword-spotting evaluation bench (sherpa-onnx KWS vs iFlytek offline command-word SDK)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sherpa-onnx>=1.12",
    # Ships the matching onnxruntime shared libs. Without it Windows silently picks up
    # C:\Windows\System32\onnxruntime.dll (v1.17) and sherpa-onnx fails with an API-version error.
    "sherpa-onnx-core>=1.12",
    "pypinyin>=0.51",
    "psutil>=5.9",
    "pydantic>=2.5",
]

[project.scripts]
kws-eval = "kws_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kws_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kws_eval --cov-report=term-missing"
markers = [
    "slow: needs downloaded models (run `kws-eval fetch` first)",
]

[tool.coverage.run]
omit = ["src/kws_eval/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
